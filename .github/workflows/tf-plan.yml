name: Terraform Plan

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
      tf_root:
        description: "Terraform root directory"
        type: string
        default: "terraform"
    outputs:
      has_changes:
        description: "Whether the plan has changes"
        value: ${{ jobs.plan.outputs.has_changes }}
      plan_key:
        description: "S3 key of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_key }}
      plan_sha256:
        description: "SHA256 hash of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_sha256 }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_key: ${{ steps.upload.outputs.plan_key }}
      plan_sha256: ${{ steps.upload.outputs.plan_sha256 }}
    env:
      PLAN_BUCKET: javabin-ci-plan-artifacts-${{ inputs.aws_account_id }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-app-${{ github.event.repository.name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: javaBin

      - name: Checkout platform scripts
        uses: actions/checkout@v5
        with:
          repository: javaBin/platform
          token: ${{ steps.app-token.outputs.token }}
          path: .platform
          sparse-checkout: scripts

      - name: Terraform Init
        working-directory: ${{ inputs.tf_root }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ inputs.tf_root }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ${{ inputs.tf_root }}
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        id: plan
        run: .platform/scripts/run-plan.sh "${{ inputs.tf_root }}"

      - name: Upload plan to S3
        id: upload
        if: steps.plan.outputs.has_changes == 'true'
        run: .platform/scripts/upload-plan.sh "${{ inputs.tf_root }}"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: sh .platform/scripts/post-plan-comment.sh "${{ inputs.tf_root }}/plan-output.txt" "${{ steps.plan.outputs.has_changes }}"
