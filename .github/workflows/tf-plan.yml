name: Terraform Plan

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
      tf_root:
        description: "Terraform root directory"
        type: string
        default: "terraform"
      team:
        description: "Team from app.yaml (the broker verifies the repo belongs to it)"
        type: string
        default: ""
    outputs:
      has_changes:
        description: "Whether the plan has changes"
        value: ${{ jobs.plan.outputs.has_changes }}
      plan_key:
        description: "S3 key of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_key }}
      plan_sha256:
        description: "SHA256 hash of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_sha256 }}
      risk_level:
        description: "Risk level from LLM review (LOW, MEDIUM, HIGH, FAILED)"
        value: ${{ jobs.plan.outputs.risk_level }}
      planned_sha:
        description: "Commit the plan was made from (includes generated Terraform)"
        value: ${{ jobs.plan.outputs.planned_sha }}
      team:
        description: "Team the CI broker verified for the repo (tf-apply uses the same state key)"
        value: ${{ jobs.plan.outputs.team }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_key: ${{ steps.upload.outputs.plan_key }}
      plan_sha256: ${{ steps.upload.outputs.plan_sha256 }}
      risk_level: ${{ steps.review.outputs.risk_level }}
      planned_sha: ${{ steps.sha.outputs.sha }}
      team: ${{ steps.broker.outputs.team }}
    env:
      PLAN_BUCKET: javabin-ci-plan-artifacts-${{ inputs.aws_account_id }}
    steps:
      - name: Set session name
        # Bot actors (renovate[bot]) contain characters STS rejects in session names
        run: echo "SESSION_NAME=$(echo "${GITHUB_ACTOR}-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}" | tr -c 'A-Za-z0-9+=,.@_\n-' '-' | head -c 64)" >> "$GITHUB_ENV"

      # Branch head, not github.sha: expand may have just committed generated
      # Terraform on top of the triggering commit. Fork PRs use the PR merge
      # ref: their github.head_ref exists only in the fork.
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref) || github.ref }}

      - name: Record planned commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      # javaBin/platform is public: the caller's own GITHUB_TOKEN can read it,
      # so app repos need no GitHub App credentials for any pipeline step.
      - name: Checkout platform scripts
        uses: actions/checkout@v6
        with:
          repository: javaBin/platform
          ref: main
          path: .platform
          sparse-checkout: scripts
          persist-credentials: false

      # Fork and Dependabot PRs get no OIDC token: skip the AWS steps with a
      # notice and only validate.
      - name: Check AWS access
        id: aws
        run: sh .platform/scripts/check-aws-access.sh

      - name: Assume broker role via OIDC
        if: steps.aws.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-app-broker
          aws-region: ${{ inputs.aws_region }}
          role-session-name: ${{ env.SESSION_NAME }}

      - name: Get team credentials from broker
        id: broker
        if: steps.aws.outputs.available == 'true'
        env:
          PROJECT: javabin
          APP_TEAM: ${{ inputs.team }}
        run: sh .platform/scripts/invoke-ci-broker.sh plan

      - name: Ensure Terraform boilerplate
        if: steps.aws.outputs.available == 'true'
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
          TEAM: ${{ steps.broker.outputs.team }}
        run: sh .platform/scripts/ensure-tf-boilerplate.sh "${{ inputs.tf_root }}"

      - name: Terraform Init
        working-directory: ${{ inputs.tf_root }}
        run: terraform init -input=false ${{ steps.aws.outputs.available != 'true' && '-backend=false' || '' }}

      - name: Terraform Validate
        working-directory: ${{ inputs.tf_root }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ${{ inputs.tf_root }}
        run: terraform fmt -check -recursive

      # Waits for a lock held by a running apply instead of failing at once.
      - name: Terraform Plan
        id: plan
        if: steps.aws.outputs.available == 'true'
        run: .platform/scripts/run-plan.sh "${{ inputs.tf_root }}" -lock-timeout=5m

      # ALB priorities are unique per listener and AWS only says so at
      # apply (PriorityInUse): check the planned rules against the live ones.
      # A conflict goes into the PR comment; the last step fails the job.
      - name: Check ALB rule priorities
        id: alb_priorities
        if: steps.plan.outputs.has_changes == 'true'
        continue-on-error: true
        run: python3 .platform/scripts/check-alb-priorities.py "${{ inputs.tf_root }}"

      - name: Upload plan to S3
        id: upload
        if: steps.plan.outputs.has_changes == 'true'
        run: .platform/scripts/upload-plan.sh "${{ inputs.tf_root }}"

      # ----------------------------------------------------------------
      # LLM plan review — done by the javabin-plan-review Lambda with
      # platform credentials (team roles have no Bedrock access, and only
      # the Lambda may write risk.json). Re-assume the broker OIDC role,
      # which may invoke it.
      # ----------------------------------------------------------------
      - name: Assume broker role for plan review
        if: steps.plan.outputs.has_changes == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-app-broker
          aws-region: ${{ inputs.aws_region }}
          role-session-name: ${{ env.SESSION_NAME }}

      - name: Run LLM review
        id: review
        if: steps.plan.outputs.has_changes == 'true'
        env:
          NOTIFY: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: sh .platform/scripts/invoke-plan-review.sh "${{ steps.upload.outputs.plan_key }}"

      - name: Post plan + review to PR
        if: github.event_name == 'pull_request' && steps.aws.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: sh .platform/scripts/post-plan-comment.sh "${{ inputs.tf_root }}/plan-output.txt" "${{ steps.plan.outputs.has_changes }}"

      - name: Fail on ALB rule priority conflict
        if: steps.alb_priorities.outcome == 'failure'
        run: |
          echo "::error file=app.yaml::ALB rule priority conflict (see the Check ALB rule priorities step); apply would fail with PriorityInUse"
          exit 1
