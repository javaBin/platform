name: Terraform Plan

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
      tf_root:
        description: "Terraform root directory"
        type: string
        default: "terraform"
    outputs:
      has_changes:
        description: "Whether the plan has changes"
        value: ${{ jobs.plan.outputs.has_changes }}
      plan_key:
        description: "S3 key of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_key }}
      plan_sha256:
        description: "SHA256 hash of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_sha256 }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_key: ${{ steps.upload.outputs.plan_key }}
      plan_sha256: ${{ steps.upload.outputs.plan_sha256 }}
    env:
      PLAN_BUCKET: javabin-ci-plan-artifacts-${{ inputs.aws_account_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-app-${{ github.event.repository.name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: javaBin

      - name: Checkout platform scripts
        uses: actions/checkout@v4
        with:
          repository: javaBin/platform
          token: ${{ steps.app-token.outputs.token }}
          path: .platform
          sparse-checkout: scripts

      - name: Generate Terraform from app.yaml
        if: hashFiles('app.yaml') != ''
        env:
          APP_SERVICE: ${{ github.event.repository.name }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          TF_ROOT: ${{ inputs.tf_root }}
        run: sh .platform/scripts/generate-terraform.sh

      - name: Configure git credentials for module downloads
        if: hashFiles('app.yaml') != ''
        run: git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        working-directory: ${{ inputs.tf_root }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ inputs.tf_root }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ${{ inputs.tf_root }}
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        id: plan
        run: .platform/scripts/run-plan.sh "${{ inputs.tf_root }}"

      - name: Upload plan to S3
        id: upload
        if: steps.plan.outputs.has_changes == 'true'
        run: .platform/scripts/upload-plan.sh "${{ inputs.tf_root }}"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ inputs.tf_root }}/plan-output.txt';
            let plan = '';
            try {
              plan = fs.readFileSync(planPath, 'utf8');
            } catch (e) {
              plan = 'Plan output not available.';
            }
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n\n... (truncated)';
            }
            const hasChanges = '${{ steps.plan.outputs.has_changes }}' === 'true';
            const status = hasChanges
              ? '**Changes detected** — review required.'
              : '**No changes** — infrastructure is up to date.';
            const body = [
              '## Terraform Plan',
              '',
              status,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
