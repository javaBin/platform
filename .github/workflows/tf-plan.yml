name: Terraform Plan

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
      tf_root:
        description: "Terraform root directory"
        type: string
        default: "terraform"
    outputs:
      has_changes:
        description: "Whether the plan has changes"
        value: ${{ jobs.plan.outputs.has_changes }}
      plan_key:
        description: "S3 key of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_key }}
      plan_sha256:
        description: "SHA256 hash of the plan artifact"
        value: ${{ jobs.plan.outputs.plan_sha256 }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_key: ${{ steps.upload.outputs.plan_key }}
      plan_sha256: ${{ steps.upload.outputs.plan_sha256 }}
    env:
      PLAN_BUCKET: javabin-ci-plan-artifacts-${{ inputs.aws_account_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-app-${{ github.event.repository.name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Generate Terraform from app.yaml
        if: hashFiles('app.yaml') != ''
        env:
          APP_SERVICE: ${{ github.event.repository.name }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          TF_ROOT: ${{ inputs.tf_root }}
        run: |
          curl -sL "https://raw.githubusercontent.com/javaBin/platform/main/scripts/generate-terraform.sh" \
            -o /tmp/generate-terraform.sh
          chmod +x /tmp/generate-terraform.sh
          /tmp/generate-terraform.sh

      - name: Terraform Init
        working-directory: ${{ inputs.tf_root }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ inputs.tf_root }}
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ${{ inputs.tf_root }}
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.tf_root }}
        run: |
          set +e
          terraform plan -out=tfplan -detailed-exitcode -no-color > plan-output.txt 2>&1
          PLAN_EXIT=$?
          set -e

          cat plan-output.txt

          if [ "$PLAN_EXIT" = "1" ]; then
            echo "Terraform plan failed"
            exit 1
          elif [ "$PLAN_EXIT" = "2" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes — downstream jobs will skip."
          fi

      - name: Upload plan to S3
        id: upload
        if: steps.plan.outputs.has_changes == 'true'
        working-directory: ${{ inputs.tf_root }}
        run: |
          PREFIX="plans/${{ github.repository }}/${{ github.run_id }}"
          SHA256=$(sha256sum tfplan | awk '{print $1}')

          aws s3 cp tfplan "s3://${PLAN_BUCKET}/${PREFIX}/tfplan"
          aws s3 cp plan-output.txt "s3://${PLAN_BUCKET}/${PREFIX}/plan-output.txt"

          echo "plan_key=${PREFIX}/tfplan" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = '${{ inputs.tf_root }}/plan-output.txt';
            let plan = '';
            try {
              plan = fs.readFileSync(planPath, 'utf8');
            } catch (e) {
              plan = 'Plan output not available.';
            }
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n\n... (truncated)';
            }
            const hasChanges = '${{ steps.plan.outputs.has_changes }}' === 'true';
            const status = hasChanges
              ? '**Changes detected** — review required.'
              : '**No changes** — infrastructure is up to date.';
            const body = [
              '## Terraform Plan',
              '',
              status,
              '',
              '<details><summary>Plan output</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
