name: Terraform Apply

on:
  workflow_call:
    inputs:
      plan_key:
        description: "S3 key of the plan artifact"
        type: string
        required: true
      plan_sha256:
        description: "SHA256 hash of the plan artifact"
        type: string
        required: true
      planned_sha:
        description: "Commit tf-plan planned from — apply runs init against the same files"
        type: string
        default: ""
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
      tf_root:
        description: "Terraform root directory"
        type: string
        default: "terraform"
      team:
        description: "Team tf-plan used (tf-plan's team output; the gate verifies the repo belongs to it)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    # One apply per repo state at a time, also for callers outside javabin.yml.
    concurrency:
      group: javabin-tf-apply-${{ github.repository }}-${{ inputs.tf_root }}
      cancel-in-progress: false
    env:
      PLAN_BUCKET: javabin-ci-plan-artifacts-${{ inputs.aws_account_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.planned_sha || github.sha }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      # javaBin/platform is public: the caller's own GITHUB_TOKEN can read it,
      # so app repos need no GitHub App credentials for any pipeline step.
      - name: Checkout platform scripts
        uses: actions/checkout@v6
        with:
          repository: javaBin/platform
          ref: main
          path: .platform
          sparse-checkout: scripts
          persist-credentials: false

      # Step 1: Lightweight OIDC role — can only invoke gate Lambda + read S3
      - name: Configure gate credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-apply-gate
          aws-region: ${{ inputs.aws_region }}

      # Step 2: Download and verify plan
      - name: Download plan from S3
        working-directory: ${{ inputs.tf_root }}
        run: aws s3 cp "s3://${PLAN_BUCKET}/${{ inputs.plan_key }}" tfplan

      - name: Verify plan integrity
        working-directory: ${{ inputs.tf_root }}
        run: sh "${{ github.workspace }}/.platform/scripts/verify-plan.sh" tfplan "${{ inputs.plan_sha256 }}"

      # Step 3: Invoke gate Lambda — checks risk, verifies override if needed, returns temp credentials
      - name: Request apply credentials from gate
        env:
          SSM_WEBHOOK_PARAM: /javabin/slack/platform-override-alerts-webhook
        run: sh .platform/scripts/invoke-apply-gate.sh "${{ inputs.plan_key }}" "${{ github.event.repository.name }}" "${{ inputs.team }}"

      # Step 4: Apply with credentials from the gate Lambda
      # Same backend.tf/providers.tf as tf-plan generated for repos that bring
      # their own Terraform without them.
      - name: Ensure Terraform boilerplate
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region || 'eu-central-1' }}
          TEAM: ${{ inputs.team }}
        run: sh .platform/scripts/ensure-tf-boilerplate.sh "${{ inputs.tf_root }}"

      # The saved plan carries the dependency lock file tf-plan's init wrote,
      # and it is covered by the SHA256 check above. Restoring it makes init
      # install exactly the provider versions the plan was made with, even if
      # a newer provider was released in between.
      - name: Restore provider lock file from plan
        working-directory: ${{ inputs.tf_root }}
        run: unzip -o -q tfplan .terraform.lock.hcl

      - name: Terraform Init
        working-directory: ${{ inputs.tf_root }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ inputs.tf_root }}
        run: terraform apply -auto-approve -lock-timeout=5m tfplan

      # Non-blocking: checks Cognito sign-in right after apply (sync errors,
      # redirect_mismatch, logout URL mismatch, unknown auth.groups). Waits
      # for app-auth-sync to process the new request. Skips apps without auth.
      - name: Auth doctor
        if: hashFiles('app.yaml') != ''
        continue-on-error: true
        env:
          APP_SERVICE: ${{ github.event.repository.name }}
        run: python3 .platform/scripts/auth-doctor.py --app-yaml app.yaml --wait 180
