name: Commit Generated Terraform

# After a successful tf-apply, commit the generated Terraform files back to
# the app repo so developers can see and review the infrastructure code.
# Uses [skip ci] to prevent re-triggering the pipeline.

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
      tf_root:
        description: "Terraform root directory"
        type: string
        default: "terraform"

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check for app.yaml
        id: check
        run: echo "has_yaml=$(test -f app.yaml && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.has_yaml == 'true'
        with:
          terraform_version: "1.7"
          terraform_wrapper: false

      - name: Generate GitHub App token
        if: steps.check.outputs.has_yaml == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: javaBin

      - name: Checkout platform scripts
        if: steps.check.outputs.has_yaml == 'true'
        uses: actions/checkout@v4
        with:
          repository: javaBin/platform
          token: ${{ steps.app-token.outputs.token }}
          path: .platform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Generate Terraform from app.yaml
        if: steps.check.outputs.has_yaml == 'true'
        env:
          APP_SERVICE: ${{ github.event.repository.name }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          TF_ROOT: ${{ inputs.tf_root }}
        run: sh .platform/scripts/generate-terraform.sh

      - name: Commit and push generated files
        if: steps.check.outputs.has_yaml == 'true'
        run: sh .platform/scripts/commit-generated-tf.sh "${{ inputs.tf_root }}" "${{ github.ref_name }}"
