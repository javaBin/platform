name: Generate Terraform

# Generates Terraform module blocks from app.yaml. Commits the generated .tf
# files back to the repo so tf-plan and tf-apply work on committed files.

on:
  workflow_call:
    inputs:
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
      tf_root:
        description: "Terraform root directory"
        type: string
        default: "terraform"
      platform_ref:
        description: "Platform repo git ref for module sources"
        type: string
        default: "main"

permissions:
  contents: write

jobs:
  generate:
    name: Generate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref }}

      # javaBin/platform is public: the caller's own GITHUB_TOKEN can read it,
      # so app repos need no GitHub App credentials for any pipeline step.
      - name: Checkout platform scripts
        uses: actions/checkout@v6
        with:
          repository: javaBin/platform
          ref: main
          path: .platform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Generate modules from app.yaml
        env:
          APP_SERVICE: ${{ github.event.repository.name }}
          AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          TF_ROOT: ${{ inputs.tf_root }}
          PLATFORM_REF: ${{ inputs.platform_ref }}
          PLATFORM_ROOT: .platform
        run: python3 .platform/scripts/generate-modules.py

      # Pushed with the caller's GITHUB_TOKEN (needs `contents: write` in the
      # app's deploy.yml). Pushes made with GITHUB_TOKEN never start another
      # workflow run, so this cannot loop.
      - name: Commit and push generated files
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          TF_ROOT: ${{ inputs.tf_root }}
          FORK_PR: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: sh .platform/scripts/commit-generated-tf.sh "$TF_ROOT" "$BRANCH"
