name: Build JVM

on:
  workflow_call:
    inputs:
      build_tool:
        description: "maven or gradle"
        type: string
        default: "maven"
      java_version:
        description: "Java version. Empty = read from .java-version/.tool-versions/mise.toml, else 21"
        type: string
        default: ""
      maven_args:
        description: "Additional Maven arguments"
        type: string
        default: ""
      gradle_args:
        description: "Additional Gradle arguments"
        type: string
        default: ""
      test_postgres_image:
        description: "PostgreSQL image for a service container on localhost:5432 (e.g. postgres:17). Empty = no database."
        type: string
        default: ""
      test_postgres_db:
        description: "Database created in the test PostgreSQL container"
        type: string
        default: "test"
      test_postgres_user:
        description: "User for the test PostgreSQL container"
        type: string
        default: "test"
      test_postgres_password:
        description: "Password for the test PostgreSQL container (throwaway CI database)"
        type: string
        default: "test"

jobs:
  build:
    name: Build JVM
    runs-on: ubuntu-latest
    # Optional database for tests that need a real PostgreSQL. GitHub skips a
    # service whose image is an empty string, so this costs nothing when
    # test_postgres_image is unset. No input is interpolated into `options`
    # (docker flags); pg_isready needs no user, and 127.0.0.1 skips the
    # socket-only server the image runs while it initialises.
    services:
      postgres:
        image: ${{ inputs.test_postgres_image }}
        env:
          POSTGRES_DB: ${{ inputs.test_postgres_db }}
          POSTGRES_USER: ${{ inputs.test_postgres_user }}
          POSTGRES_PASSWORD: ${{ inputs.test_postgres_password }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Checkout platform scripts
        uses: actions/checkout@v6
        with:
          repository: javaBin/platform
          ref: main
          path: .platform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Resolve Java version
        id: java
        run: sh .platform/scripts/resolve-tool-version.sh java "${{ inputs.java_version }}" 21

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: ${{ inputs.build_tool }}

      # libpq-style variables, for tests that read their connection from the
      # environment. Apps with hardcoded test settings can ignore them.
      - name: Export test PostgreSQL connection
        if: inputs.test_postgres_image != ''
        env:
          PG_DB: ${{ inputs.test_postgres_db }}
          PG_USER: ${{ inputs.test_postgres_user }}
          PG_PASSWORD: ${{ inputs.test_postgres_password }}
        run: |
          # Plain identifiers only, and no newline in the password: these
          # values are written to $GITHUB_ENV, one variable per line.
          for v in "$PG_DB" "$PG_USER"; do
            if ! printf '%s' "$v" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]{0,62}$'; then
              echo "::error::test_postgres_db and test_postgres_user must be plain identifiers (letters, digits, _): '$v'"
              exit 1
            fi
          done
          if [ "$(printf '%s' "$PG_PASSWORD" | wc -l)" -ne 0 ]; then
            echo "::error::test_postgres_password must not contain a newline"
            exit 1
          fi
          {
            echo "PGHOST=localhost"
            echo "PGPORT=5432"
            echo "PGDATABASE=$PG_DB"
            echo "PGUSER=$PG_USER"
            echo "PGPASSWORD=$PG_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build and test (Maven)
        if: inputs.build_tool == 'maven'
        run: mvn --batch-mode verify ${{ inputs.maven_args }}

      - name: Build and test (Gradle)
        if: inputs.build_tool == 'gradle'
        run: |
          if [ -x ./gradlew ]; then ./gradlew build ${{ inputs.gradle_args }}; else gradle build ${{ inputs.gradle_args }}; fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore
