name: Provision App

# Triggered by javaBin/registry when an app registration is merged.
# Reads app names from the dispatch payload, fetches their YAML from the
# registry, and updates registered-apps.auto.tfvars. The commit triggers
# platform-ci.yml which runs plan -> review -> apply to create IAM roles.

on:
  repository_dispatch:
    types: [registry-update]

permissions:
  contents: write

env:
  TF_ROOT: terraform/platform

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: javaBin

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Process registry update
        env:
          DISPATCH_APPS: ${{ github.event.client_payload.apps }}
          DISPATCH_TEAMS: ${{ github.event.client_payload.teams }}
        run: |
          echo "Registry update received"
          echo "  Apps: ${DISPATCH_APPS}"
          echo "  Teams: ${DISPATCH_TEAMS}"

      - name: Fetch all registered apps from registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # List all app YAML files in the registry
          APPS=$(gh api repos/javaBin/registry/contents/apps \
            --jq '.[].name' | grep '\.yaml$' | sed 's/\.yaml$//' | sort)

          if [ -z "$APPS" ]; then
            echo "No apps registered in registry"
            echo '[]' > /tmp/app-list.json
          else
            echo "$APPS" | jq -R -s 'split("\n") | map(select(length > 0))' > /tmp/app-list.json
          fi

          echo "Registered apps:"
          cat /tmp/app-list.json

      - name: Update registered-apps.auto.tfvars
        env:
          TFVARS_FILE: ${{ env.TF_ROOT }}/registered-apps.auto.tfvars
        run: |
          python3 << 'PYEOF'
          import json, os

          tfvars_file = os.environ["TFVARS_FILE"]

          with open("/tmp/app-list.json") as f:
              apps = json.load(f)

          lines = [
              "# GENERATED by provision-app workflow — do not edit manually.",
              "# Source of truth: javaBin/registry/apps/",
              "",
              "registered_app_repos = [",
          ]
          for app in sorted(apps):
              lines.append(f'  "{app}",')
          lines.append("]")
          lines.append("")

          with open(tfvars_file, "w") as f:
              f.write("\n".join(lines))
          PYEOF

          echo "Generated ${TFVARS_FILE}:"
          cat "${TFVARS_FILE}"

      - name: Commit and push if changed
        env:
          TFVARS_FILE: ${{ env.TF_ROOT }}/registered-apps.auto.tfvars
          DISPATCH_APPS: ${{ github.event.client_payload.apps }}
        run: |
          git config user.name "javabin-platform[bot]"
          git config user.email "platform@javazone.no"

          git add "${TFVARS_FILE}"

          if git diff --cached --quiet; then
            echo "No changes to registered apps — skipping commit."
          else
            git commit -m "Update registered apps from registry

          Triggered by repository_dispatch from javaBin/registry.
          Apps: ${DISPATCH_APPS}"

            git push origin main
            echo "Committed and pushed. Platform CI will now plan and apply."
          fi
