name: Docker Build

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path to Dockerfile"
        type: string
        default: "Dockerfile"
      build_context:
        description: "Docker build context"
        type: string
        default: "."
      app_name:
        description: "App name from app.yaml (ECR repo / ECS service are {team}-{app_name}); defaults to repo name"
        type: string
        default: ""
      team:
        description: "Team from app.yaml (the broker verifies the repo belongs to it)"
        type: string
        default: ""
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
    outputs:
      image_uri:
        description: "Full image URI with tag"
        value: ${{ jobs.build.outputs.image_uri }}
      image_tag:
        description: "Primary image tag (sha-*)"
        value: ${{ jobs.build.outputs.image_tag }}
      image:
        description: "Image pinned to the pushed digest ({repo}@sha256:...), what ecs-deploy runs"
        value: ${{ jobs.build.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
      image_tag: ${{ steps.tags.outputs.primary_tag }}
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Set session name
        # Bot actors (renovate[bot]) contain characters STS rejects in session names
        run: echo "SESSION_NAME=$(echo "${GITHUB_ACTOR}-${GITHUB_SHA:0:8}-${GITHUB_RUN_ID}" | tr -c 'A-Za-z0-9+=,.@_\n-' '-' | head -c 64)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      # javaBin/platform is public: the caller's own GITHUB_TOKEN can read it,
      # so app repos need no GitHub App credentials for any pipeline step.
      - name: Checkout platform scripts
        uses: actions/checkout@v6
        with:
          repository: javaBin/platform
          ref: main
          path: .platform
          sparse-checkout: scripts
          persist-credentials: false

      - name: Assume broker role via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-app-broker
          aws-region: ${{ inputs.aws_region }}
          role-session-name: ${{ env.SESSION_NAME }}

      - name: Get deploy credentials from broker
        id: broker
        env:
          PROJECT: javabin
          APP_TEAM: ${{ inputs.team }}
        run: sh .platform/scripts/invoke-ci-broker.sh deploy

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine image tags
        id: tags
        env:
          TEAM: ${{ steps.broker.outputs.team }}
          APP_NAME: ${{ inputs.app_name || github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          REPO="${REGISTRY}/${TEAM}-${APP_NAME}"
          SHA_TAG="sha-${GITHUB_SHA::8}"
          echo "primary_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

          TAGS="${REPO}:${SHA_TAG}"

          # Default branch, whatever it is called (the same check as the deploy
          # jobs in javabin.yml). The date tag keeps the main- prefix whatever
          # the branch name: the ECR lifecycle policy keeps the newest main-*.
          if [ -n "${DEFAULT_BRANCH}" ] && [ "${REF}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            DATE_TAG="main-$(date -u +%Y%m%d-%H%M)"
            TAGS="${TAGS},${REPO}:${DATE_TAG},${REPO}:latest"
          fi

          if echo "${REF}" | grep -q '^refs/tags/v'; then
            TAGS="${TAGS},${REPO}:${REF_NAME}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set output
        id: push
        env:
          REPO: ${{ steps.tags.outputs.repo }}
          PRIMARY_TAG: ${{ steps.tags.outputs.primary_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [ -n "${DIGEST}" ] || { echo "::error::build-push-action returned no image digest"; exit 1; }
          echo "image_uri=${REPO}:${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
