name: Approve Override

# Workflow dispatch — only runs after approval from the 'override-approval'
# GitHub environment (requires board member review).

on:
  workflow_dispatch:
    inputs:
      plan_key:
        description: "S3 plan key (from the Slack alert)"
        required: true
        type: string
      repo:
        description: "Repository (e.g. javaBin/moresleep)"
        required: true
        type: string
      run_id:
        description: "Failed apply run ID to retrigger"
        required: true
        type: string
      reason:
        description: "Reason for override"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_ACCOUNT_ID: "553637109631"
  AWS_REGION: eu-central-1

jobs:
  approve:
    name: Approve Override
    runs-on: ubuntu-latest
    environment: override-approval
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/javabin-ci-override-approver
          aws-region: ${{ env.AWS_REGION }}

      # The gate verifies this job's GitHub OIDC token (workflow, repo and
      # override-approval environment) and records its actor as approver.
      # Inputs go through env, never into the script text.
      - name: Sign override via gate Lambda
        env:
          PLAN_KEY: ${{ inputs.plan_key }}
          REASON: ${{ inputs.reason }}
        run: sh scripts/invoke-override-sign.sh

      - name: Notify Slack
        env:
          SSM_WEBHOOK_PARAM: /javabin/slack/platform-override-alerts-webhook
          REPO: ${{ inputs.repo }}
          PLAN_KEY: ${{ inputs.plan_key }}
          REASON: ${{ inputs.reason }}
        run: sh scripts/notify-slack.sh "Risk Override Approved" "*Repo:* ${REPO}\n*Plan:* \`${PLAN_KEY}\`\n*By:* ${GITHUB_ACTOR}\n*Reason:* ${REASON}"

      - name: Retrigger failed apply
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ inputs.repo }}
        run: gh run rerun "$RUN_ID" --repo "$REPO" --failed
