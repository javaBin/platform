name: Approve Override

# Workflow dispatch — only runs after approval from the 'override-approval'
# GitHub environment (requires board member review).
#
# Only plan_key and reason are needed: the repo and run come from the plan
# key. For a platform run the failed jobs are re-run here; github.token cannot
# touch app repos, so for an app run the job prints the run URL and the
# developer clicks "Re-run failed jobs" (docs/apply-gate.md#requesting-an-override).

on:
  workflow_dispatch:
    inputs:
      plan_key:
        description: "S3 plan key, plans/javaBin/<repo>/<run_id>/tfplan (from the blocked run's log or the Slack alert)"
        required: true
        type: string
      repo:
        description: "Optional check: repository (e.g. javaBin/moresleep); must match the plan key"
        required: false
        type: string
      run_id:
        description: "Optional check: blocked run ID; must match the plan key"
        required: false
        type: string
      reason:
        description: "Reason for override"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: write

env:
  AWS_ACCOUNT_ID: "553637109631"
  AWS_REGION: eu-central-1

jobs:
  approve:
    name: Approve Override
    runs-on: ubuntu-latest
    environment: override-approval
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts

      # Before signing: a plan key that names no run is refused here.
      - name: Resolve blocked run
        id: target
        env:
          PLAN_KEY: ${{ inputs.plan_key }}
          REPO: ${{ inputs.repo }}
          RUN_ID: ${{ inputs.run_id }}
        run: sh scripts/override-target.sh resolve

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/javabin-ci-override-approver
          aws-region: ${{ env.AWS_REGION }}

      # The gate verifies this job's GitHub OIDC token (workflow, repo and
      # override-approval environment) and records its actor as approver.
      # Inputs go through env, never into the script text.
      - name: Sign override via gate Lambda
        env:
          PLAN_KEY: ${{ inputs.plan_key }}
          REASON: ${{ inputs.reason }}
        run: sh scripts/invoke-override-sign.sh

      - name: Notify Slack
        env:
          SSM_WEBHOOK_PARAM: /javabin/slack/platform-override-alerts-webhook
          REPO: ${{ steps.target.outputs.repo }}
          RUN_URL: ${{ steps.target.outputs.run_url }}
          PLAN_KEY: ${{ inputs.plan_key }}
          REASON: ${{ inputs.reason }}
        run: sh scripts/notify-slack.sh "Risk Override Approved" "*Repo:* ${REPO}\n*Plan:* \`${PLAN_KEY}\`\n*By:* ${GITHUB_ACTOR}\n*Reason:* ${REASON}\n*Next:* Re-run failed jobs on the blocked run (automatic for javaBin/platform)" "$RUN_URL" "Blocked run"

      - name: Retrigger failed apply
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
          REPO: ${{ steps.target.outputs.repo }}
        run: sh scripts/override-target.sh retrigger
