name: Plan Review

on:
  workflow_call:
    inputs:
      plan_key:
        description: "S3 key of the plan artifact"
        type: string
        required: true
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"
    outputs:
      risk_level:
        description: "Risk level from LLM review (LOW, MEDIUM, HIGH, FAILED)"
        value: ${{ jobs.review.outputs.risk_level }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      risk_level: ${{ steps.review.outputs.risk_level }}
    env:
      PLAN_BUCKET: javabin-ci-plan-artifacts-${{ inputs.aws_account_id }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: javaBin

      - uses: actions/checkout@v4
        with:
          repository: javaBin/platform
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          sparse-checkout: scripts
          path: platform

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-app-${{ github.event.repository.name }}
          aws-region: ${{ inputs.aws_region }}

      - name: Download plan text from S3
        run: aws s3 cp "s3://${PLAN_BUCKET}/$(dirname "${{ inputs.plan_key }}")/plan-output.txt" plan-output.txt

      - name: Run LLM review
        id: review
        env:
          REVIEW_RESULT_PATH: review-result.json
        run: sh platform/scripts/extract-review-risk.sh platform/scripts/review-plan.py plan-output.txt

      - name: Post review to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let review = '';
            try {
              review = fs.readFileSync('review-output.txt', 'utf8');
            } catch (e) {
              review = 'LLM review output not available.';
            }
            let resultJson = {};
            try {
              resultJson = JSON.parse(fs.readFileSync('review-result.json', 'utf8'));
            } catch (e) {
              resultJson = {risk: 'FAILED'};
            }
            const riskEmoji = {LOW: '\u{1F7E2}', MEDIUM: '\u{1F7E1}', HIGH: '\u{1F534}', FAILED: '\u26AA'}[resultJson.risk] || '\u26AA';

            const body = [
              '## LLM Plan Review',
              '',
              `**Risk: ${riskEmoji} ${resultJson.risk}**`,
              '',
              review
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Alert Slack on HIGH risk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.review.outputs.risk_level == 'HIGH'
        run: sh platform/scripts/notify-high-risk.sh /javabin/slack/platform-override-alerts-webhook "https://github.com/javaBin/platform/actions/workflows/approve-override.yml"
