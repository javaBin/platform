name: Javabin CI

# Unified entrypoint — app repos call this with a short deploy.yml:
#
#   name: Deploy
#   on:
#     push:
#       branches: [main]   # your default branch (main or master)
#     pull_request:
#     workflow_dispatch:
#   permissions:
#     id-token: write       # AWS OIDC
#     contents: write       # expand commits generated Terraform
#     pull-requests: write  # plan comments
#   jobs:
#     javabin:
#       uses: javaBin/platform/.github/workflows/javabin.yml@main
#
# No repository or organization secrets are required: AWS access is OIDC,
# and platform scripts are read from this public repo with the caller's
# GITHUB_TOKEN. Onboarding prerequisites are listed in
# docs/reusable-workflows.md.
#
# Deploy jobs (docker-build, tf-apply, ecs-deploy, eb-deploy) run only for
# pushes and manual runs on the repo's default branch, whatever it is called
# (main, master, ...). Pull requests and other branches build, test and plan.

on:
  workflow_call:
    inputs:
      node_version:
        description: "Node.js version override (default: read from the repo's version files)"
        type: string
        default: ""
      pnpm_version:
        description: "pnpm version override (default: packageManager in package.json)"
        type: string
        default: ""
      java_version:
        description: "Java version override (default: read from the repo's version files)"
        type: string
        default: ""
      maven_args:
        description: "Extra arguments for `mvn verify` (e.g. -DskipITs)"
        type: string
        default: ""
      gradle_args:
        description: "Extra arguments for `gradle build`"
        type: string
        default: ""
      test_postgres_image:
        description: "Run a PostgreSQL service container on localhost:5432 during the JVM build (e.g. postgres:17). Empty = no database."
        type: string
        default: ""
      test_postgres_db:
        description: "Database created in the test PostgreSQL container"
        type: string
        default: "test"
      test_postgres_user:
        description: "User for the test PostgreSQL container"
        type: string
        default: "test"
      test_postgres_password:
        description: "Password for the test PostgreSQL container (throwaway CI database, not a secret)"
        type: string
        default: "test"

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Detect repo contents
  # --------------------------------------------------------------------------
  detect:
    uses: javaBin/platform/.github/workflows/detect.yml@main

  # --------------------------------------------------------------------------
  # 2. Build (JVM or TypeScript — parallel, skipped if not applicable)
  # --------------------------------------------------------------------------
  build-jvm:
    needs: detect
    if: needs.detect.outputs.has_maven == 'true' || needs.detect.outputs.has_gradle == 'true'
    uses: javaBin/platform/.github/workflows/build-jvm.yml@main
    with:
      build_tool: ${{ needs.detect.outputs.has_maven == 'true' && 'maven' || 'gradle' }}
      java_version: ${{ inputs.java_version }}
      maven_args: ${{ inputs.maven_args }}
      gradle_args: ${{ inputs.gradle_args }}
      test_postgres_image: ${{ inputs.test_postgres_image }}
      test_postgres_db: ${{ inputs.test_postgres_db }}
      test_postgres_user: ${{ inputs.test_postgres_user }}
      test_postgres_password: ${{ inputs.test_postgres_password }}

  build-ts:
    needs: detect
    if: needs.detect.outputs.has_pnpm == 'true'
    uses: javaBin/platform/.github/workflows/build-ts.yml@main
    with:
      node_version: ${{ inputs.node_version }}
      pnpm_version: ${{ inputs.pnpm_version }}

  # --------------------------------------------------------------------------
  # 3. Docker build + ECR push (default branch only, after builds pass)
  # --------------------------------------------------------------------------
  docker-build:
    needs: [detect, build-jvm, build-ts, tf-plan, tf-apply]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.detect.outputs.has_docker == 'true' &&
      (needs.build-jvm.result == 'success' || needs.build-jvm.result == 'skipped') &&
      (needs.build-ts.result == 'success' || needs.build-ts.result == 'skipped') &&
      needs.tf-plan.result != 'failure' &&
      (needs.tf-apply.result == 'success' || needs.tf-apply.result == 'skipped')
    uses: javaBin/platform/.github/workflows/docker-build.yml@main
    with:
      app_name: ${{ needs.detect.outputs.app_name }}
      team: ${{ needs.detect.outputs.app_team }}

  # --------------------------------------------------------------------------
  # 4. Expand app.yaml → Terraform files (commit to repo, run once)
  # --------------------------------------------------------------------------
  expand:
    needs: detect
    if: needs.detect.outputs.has_yaml == 'true'
    uses: javaBin/platform/.github/workflows/expand-terraform.yml@main

  # --------------------------------------------------------------------------
  # 5. Terraform plan (after expand commits TF files, or if terraform/ already exists)
  # --------------------------------------------------------------------------
  tf-plan:
    needs: [detect, expand]
    if: |
      always() &&
      (needs.detect.outputs.has_tf == 'true' || needs.detect.outputs.has_yaml == 'true') &&
      (needs.expand.result == 'success' || needs.expand.result == 'skipped')
    uses: javaBin/platform/.github/workflows/tf-plan.yml@main
    with:
      team: ${{ needs.detect.outputs.app_team }}

  # --------------------------------------------------------------------------
  # 6. Terraform apply (default branch only, after plan + review — blocked on HIGH risk)
  # --------------------------------------------------------------------------
  tf-apply:
    needs: [detect, tf-plan]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.tf-plan.outputs.has_changes == 'true'
    uses: javaBin/platform/.github/workflows/tf-apply.yml@main
    with:
      plan_key: ${{ needs.tf-plan.outputs.plan_key }}
      plan_sha256: ${{ needs.tf-plan.outputs.plan_sha256 }}
      planned_sha: ${{ needs.tf-plan.outputs.planned_sha }}
      team: ${{ needs.detect.outputs.app_team }}

  # --------------------------------------------------------------------------
  # 7. ECS deploy (default branch only, after docker build + TF apply)
  # --------------------------------------------------------------------------
  ecs-deploy:
    needs: [detect, docker-build, tf-apply]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.docker-build.result == 'success' &&
      (needs.tf-apply.result == 'success' || needs.tf-apply.result == 'skipped')
    uses: javaBin/platform/.github/workflows/ecs-deploy.yml@main
    with:
      image_tag: ${{ needs.docker-build.outputs.image_tag }}
      app_name: ${{ needs.detect.outputs.app_name }}
      team: ${{ needs.detect.outputs.app_team }}

  # (commit-terraform removed — expand-terraform.yml handles it)

  # --------------------------------------------------------------------------
  # 9. EB deploy (transitional — for repos with .elasticbeanstalk/)
  # --------------------------------------------------------------------------
  eb-deploy:
    needs: [detect, build-jvm, build-ts]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.detect.outputs.has_eb == 'true' &&
      (needs.build-jvm.result == 'success' || needs.build-jvm.result == 'skipped') &&
      (needs.build-ts.result == 'success' || needs.build-ts.result == 'skipped')
    uses: javaBin/platform/.github/workflows/eb-deploy.yml@main
    with:
      environment_name: ${{ needs.detect.outputs.app_name }}
    secrets: inherit
