name: ECS Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Container image tag (unused — kept for workflow_call compat)"
        type: string
        default: ""
      service_name:
        description: "ECS service name (defaults to repo name)"
        type: string
        default: ""
      cluster_name:
        description: "ECS cluster name"
        type: string
        default: "javabin-platform"
      aws_account_id:
        description: "AWS account ID"
        type: string
        default: "553637109631"
      aws_region:
        description: "AWS region"
        type: string
        default: "eu-central-1"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: ECS Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: javaBin

      - name: Checkout platform scripts
        uses: actions/checkout@v6
        with:
          repository: javaBin/platform
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          sparse-checkout: scripts
          path: .platform

      - name: Resolve team from GitHub
        id: team
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEAM=$(gh api "/repos/${{ github.repository }}/teams" \
            --jq '[.[] | select(.slug != "platform-owners")] | .[0].slug // empty' 2>/dev/null || true)
          if [ -z "$TEAM" ]; then echo "ERROR: repo not in a team"; exit 1; fi
          echo "team=$TEAM" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/javabin-ci-deploy-${{ steps.team.outputs.team }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy to ECS
        env:
          SERVICE: ${{ inputs.service_name || github.event.repository.name }}
          CLUSTER: ${{ inputs.cluster_name }}
        run: sh .platform/scripts/ecs-deploy.sh
